<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commonplace Connector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo-area">
        <img class="logo" src="icons/icon-48.png" alt="Lotus Logo">
        <span class="app-name">Commonplace</span>
      </div>
      <button id="settings-btn" class="settings-btn" title="Open Settings">
        <svg viewBox="0 0 24 24" class="settings-icon">
          <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
    </header>

    <main class="main-form">
      <!-- Title Field -->
      <div class="form-group">
        <label for="page-title">Title</label>
        <textarea id="page-title" rows="2" placeholder="Loading page title..."></textarea>
      </div>

      <!-- URL Field -->
      <div class="form-group">
        <label for="page-url">URL</label>
        <input type="url" id="page-url" placeholder="Loading URL...">
      </div>

      <!-- Content Type Tabs -->
      <div class="form-group">
        <label>Content Type</label>
        <div class="type-selector">
          <button type="button" class="type-btn active" data-type="article">
            Article / Page
          </button>
          <button type="button" class="type-btn" data-type="tweet">
            Tweet
          </button>
        </div>
      </div>

      <!-- Submit Action -->
      <button id="add-btn" class="add-btn">Add to Commonplace</button>

      <!-- Status indicator -->
      <div id="status-container" class="status-container">
        <span id="status-text"></span>
      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
